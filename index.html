<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4fc">
  <meta name="description" content="Marcador divertido de puntos para Zoe y Noa.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zoe y Noa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>🌟 Marcador de Zoe y Noa</title>
  <style>
    :root{--zoe:#a855f7;--zoe-light:#f3e8ff;--noa:#0d9488;--noa-light:#ccfbf1;--ink:#302541}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;min-height:100dvh;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#ffe4f2 0,transparent 28%),radial-gradient(circle at 90% 85%,#ccfbf1 0,transparent 30%),#fffafd;display:flex;flex-direction:column;align-items:center}
    .app{width:100%;max-width:650px;padding:calc(18px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));margin:auto}
    header{text-align:center;margin-bottom:20px}.crown{font-size:42px;animation:float 2.5s ease-in-out infinite}
    h1{font-size:clamp(25px,6vw,36px);margin:5px 0;font-weight:900;letter-spacing:-1px}.subtitle{color:#887b94;font-size:14px;margin:8px 0 0}
    .scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .player{position:relative;overflow:hidden;min-width:0;padding:20px 10px 18px;border-radius:27px;text-align:center;border:2px solid transparent;box-shadow:0 9px 25px #39224a12}
    .zoe{background:linear-gradient(160deg,#fff 0%,var(--zoe-light) 100%);border-color:#e9d5ff}.noa{background:linear-gradient(160deg,#fff 0%,var(--noa-light) 100%);border-color:#99f6e4}
    .avatar{width:76px;height:76px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;border-radius:50%;font-size:43px;background:#ffffffc9;box-shadow:0 4px 12px #0000000a}
    .player h2{font-size:clamp(23px,6vw,30px);margin:6px 0;font-weight:900}.zoe h2,.zoe .score{color:#9333ea}.noa h2,.noa .score{color:#0f9488}
    .label{font-size:12px;color:#8a7e94;text-transform:uppercase;letter-spacing:1.5px;font-weight:bold}
    .score{font-size:clamp(66px,18vw,92px);line-height:1.2;font-weight:900;margin:7px 0 14px;font-variant-numeric:tabular-nums;transition:color .2s}.score.bump{animation:bump .35s ease}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:none;cursor:pointer;font-family:inherit;font-weight:900;touch-action:manipulation;transition:transform .12s,filter .12s}button:active{transform:scale(.92);filter:brightness(.95)}
    .add,.subtract{min-height:57px;border-radius:17px;font-size:28px;box-shadow:0 4px 0 #00000010}.add{color:white;background:linear-gradient(135deg,#4ade80,#16a34a)}.subtract{color:#be123c;background:#ffe4e6}
    .add small,.subtract small{display:block;font-size:10px;margin-top:1px;letter-spacing:.4px}.player-footer{font-size:12px;color:#897d93;margin-top:13px;min-height:17px}
    .total{margin:17px 0;padding:13px;border-radius:18px;background:#ffffffc9;text-align:center;box-shadow:0 4px 16px #39224a0a}.total strong{color:#8b5cf6;font-size:22px}.total p{margin:3px 0 0;font-size:12px;color:#897d93}
    .bottom{text-align:center;padding-top:3px}.reset{padding:12px 18px;border-radius:14px;background:#fff;border:1px solid #e9ddec;color:#78677f;font-size:13px;box-shadow:0 3px 10px #00000008}.hint{margin-top:12px;font-size:11px;color:#a49aaa}
    .confetti{position:fixed;top:-20px;z-index:99;pointer-events:none;font-size:22px;animation:fall 1.2s ease-in forwards}
    .toast{position:fixed;z-index:100;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#302541;color:#fff;padding:12px 20px;border-radius:25px;font-size:14px;font-weight:bold;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}70%{transform:scale(.96) rotate(2deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(650deg);opacity:0}}
    @media(max-width:360px){.app{padding-left:8px;padding-right:8px}.scoreboard{gap:8px}.player{padding:15px 7px;border-radius:22px}.avatar{width:62px;height:62px;font-size:36px}.add,.subtract{min-height:52px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="crown" aria-hidden="true">🏆</div><h1>¡A por las estrellas!</h1><p class="subtitle">Cada esfuerzo cuenta. ¡Vosotras podéis! ✨</p></header>
  <section class="scoreboard" aria-label="Marcador de puntos">
    <article class="player zoe" id="player-zoe">
      <div class="avatar" aria-hidden="true">🦄</div><h2>Zoe</h2><div class="label">Mis puntos</div>
      <div class="score" id="score-zoe" role="status" aria-live="polite">0</div>
      <div class="controls"><button class="add" type="button" onclick="changeScore('zoe',1)" aria-label="Sumar un punto a Zoe">+<small>SUMAR</small></button><button class="subtract" type="button" onclick="changeScore('zoe',-1)" aria-label="Restar un punto a Zoe">−<small>RESTAR</small></button></div>
      <div class="player-footer" id="message-zoe">🌟 ¡Brilla, Zoe!</div>
    </article>
    <article class="player noa" id="player-noa">
      <div class="avatar" aria-hidden="true">🦋</div><h2>Noa</h2><div class="label">Mis puntos</div>
      <div class="score" id="score-noa" role="status" aria-live="polite">0</div>
      <div class="controls"><button class="add" type="button" onclick="changeScore('noa',1)" aria-label="Sumar un punto a Noa">+<small>SUMAR</small></button><button class="subtract" type="button" onclick="changeScore('noa',-1)" aria-label="Restar un punto a Noa">−<small>RESTAR</small></button></div>
      <div class="player-footer" id="message-noa">✨ ¡Tú puedes, Noa!</div>
    </article>
  </section>
  <section class="total" aria-live="polite"><div>🌈 Puntos entre las dos: <strong id="total">0</strong></div><p id="winner">¡La aventura acaba de empezar!</p></section>
  <div class="bottom"><button class="reset" type="button" onclick="resetScores()">🔄 Reiniciar marcadores</button><p class="hint">💖 ¡Lo importante es intentarlo!</p></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const STORAGE_KEY="marcadorZoeNoa_v1";const scores={zoe:0,noa:0};
function loadScores(){try{const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return;const data=JSON.parse(saved);for(const name of ["zoe","noa"]){if(Number.isSafeInteger(data[name])&&data[name]>=0)scores[name]=data[name]}}catch(e){}}
function saveScores(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(scores))}catch(e){}}
function render(){document.getElementById("score-zoe").textContent=scores.zoe;document.getElementById("score-noa").textContent=scores.noa;const total=scores.zoe+scores.noa;document.getElementById("total").textContent=total;const winner=document.getElementById("winner");if(scores.zoe===scores.noa){winner.textContent=total===0?"¡La aventura acaba de empezar!":"🤝 ¡Empate! ¡Las dos sois geniales!"}else{winner.textContent=`👑 ${scores.zoe>scores.noa?"Zoe":"Noa"} tiene más puntos. ¡Seguid así!`}for(const name of ["zoe","noa"]){const message=document.getElementById("message-"+name);message.textContent=scores[name]===0?(name==="zoe"?"🌟 ¡Brilla, Zoe!":"✨ ¡Tú puedes, Noa!"):scores[name]>=10?"🏆 ¡Increíble! ¡10 o más!":scores[name]>=5?"🎉 ¡Vas genial!":"⭐ ¡Cada punto cuenta!"}}
let toastTimer;function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1500)}
function animateScore(name){const score=document.getElementById("score-"+name);score.classList.remove("bump");void score.offsetWidth;score.classList.add("bump");score.addEventListener("animationend",()=>score.classList.remove("bump"),{once:true})}
function makeConfetti(){const pieces=["🌟","✨","💖","🎉","⭐","🌈"];for(let i=0;i<12;i++){const piece=document.createElement("span");piece.className="confetti";piece.textContent=pieces[Math.floor(Math.random()*pieces.length)];piece.style.left=Math.random()*100+"vw";piece.style.animationDelay=Math.random()*.25+"s";piece.style.fontSize=16+Math.random()*16+"px";document.body.appendChild(piece);piece.addEventListener("animationend",()=>piece.remove())}}
function changeScore(name,amount){if(!Object.hasOwn(scores,name))return;if(amount<0&&scores[name]===0){showToast("😊 ¡La puntuación ya está en cero!");return}if(amount>0&&scores[name]>=Number.MAX_SAFE_INTEGER){showToast("¡Has alcanzado el límite de puntos!");return}scores[name]+=amount;render();saveScores();animateScore(name);if(amount>0){makeConfetti();showToast(name==="zoe"?"🌟 ¡Un punto para Zoe!":"✨ ¡Un punto para Noa!")}else showToast("Punto restado")}
function resetScores(){if(!window.confirm("¿Seguro que quieres reiniciar los marcadores de Zoe y Noa? Las dos puntuaciones volverán a cero."))return;scores.zoe=0;scores.noa=0;render();saveScores();showToast("🔄 ¡Marcadores reiniciados!")}
loadScores();render();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
